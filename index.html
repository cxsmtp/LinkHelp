<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0f172a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="AppSec Brief"/>
<link rel="manifest" href="manifest.json"/>
<title>AppSec Thought Leadership Engine</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f172a;--surface:#1e293b;--surface2:#263248;--border:#334155;
  --text:#f1f5f9;--muted:#94a3b8;--accent:#3b82f6;--green:#22c55e;
  --amber:#f59e0b;--red:#ef4444;--purple:#a78bfa;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* Layout */
#app{display:flex;flex-direction:column;height:100vh;max-width:860px;margin:0 auto}
header{padding:16px 20px 0;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.brand-icon{width:36px;height:36px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;letter-spacing:-.5px}
.brand-text h1{font-size:15px;font-weight:700;color:var(--text)}
.brand-text p{font-size:12px;color:var(--muted)}
nav{display:flex;gap:4px;padding-bottom:0}
nav button{flex:1;padding:8px 4px;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.3px;text-transform:uppercase}
nav button.active{color:var(--text);border-bottom-color:var(--accent)}
.divider{height:1px;background:var(--border);margin:0 0 0}

main{flex:1;overflow-y:auto;padding:20px}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px}
.card:last-child{margin-bottom:0}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.card-title{font-size:14px;font-weight:600;color:var(--text);line-height:1.4;flex:1}
.card-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.card-summary{font-size:13px;color:var(--muted);line-height:1.5}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.3px}
.tag-primary{background:#1e3a5f;color:#60a5fa}
.tag-cluster{background:#1a2e1a;color:#4ade80}
.tag-score{background:#2d1f4e;color:#c4b5fd}

/* Score bar */
.score-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.score-label{font-size:11px;color:var(--muted);width:80px;flex-shrink:0}
.score-bar{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.score-fill{height:100%;border-radius:2px;transition:width .4s ease}
.score-num{font-size:11px;color:var(--muted);width:28px;text-align:right}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.2px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#2563eb}
.btn-primary:disabled{background:var(--border);color:var(--muted);cursor:not-allowed}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--muted)}
.btn-ghost:hover{border-color:var(--accent);color:var(--text)}
.btn-green{background:#166534;color:#86efac}
.btn-green:hover{background:#15803d}
.btn-full{width:100%}
.btn-sm{padding:6px 12px;font-size:12px}

/* Status */
.status-row{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:16px;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-green{background:var(--green)}
.dot-amber{background:var(--amber)}
.dot-red{background:var(--red)}
.dot-pulse{animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Workbench */
.workbench{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px}
.workbench h2{font-size:16px;font-weight:700;margin-bottom:4px}
.workbench .subtitle{font-size:13px;color:var(--muted);margin-bottom:16px}
.section-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}

/* Prompt preview */
.prompt-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-size:12px;color:var(--muted);line-height:1.7;max-height:280px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}

/* Selected article highlight */
.article-selected{border-color:var(--accent);background:var(--surface2)}

/* Empty state */
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty-icon{font-size:36px;margin-bottom:12px;opacity:.4}
.empty h3{font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px}
.empty p{font-size:13px;line-height:1.5}

/* Sources panel */
.source-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.source-row:last-child{border-bottom:none}
.source-info h4{font-size:13px;font-weight:600}
.source-info p{font-size:12px;color:var(--muted)}
.source-status{font-size:11px;font-weight:600}

/* Share instruction */
.share-steps{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;margin-top:12px}
.share-steps p{font-size:13px;color:var(--muted);margin-bottom:8px}
.share-step{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;font-size:13px}
.share-step:last-child{margin-bottom:0}
.step-num{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}

/* Toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;z-index:999;pointer-events:none}
#toast.show{opacity:1}

/* Filters */
.filter-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.filter-row::-webkit-scrollbar{display:none}
.filter-btn{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* Scoring breakdown */
.scores-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.score-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px}
.score-item-label{font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.score-item-val{font-size:20px;font-weight:700}

@media(max-width:480px){
  main{padding:14px}
  .scores-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="brand-icon">AS</div>
      <div class="brand-text">
        <h1>AppSec Thought Leadership Engine</h1>
        <p>Ingest · Score · Select · Write</p>
      </div>
    </div>
    <nav>
      <button class="active" onclick="showTab('feed')">Feed</button>
      <button onclick="showTab('workbench')">Workbench</button>
      <button onclick="showTab('sources')">Sources</button>
    </nav>
    <div class="divider"></div>
  </header>
  <main id="main-content"></main>
</div>
<div id="toast"></div>

<script>
// ── State ─────────────────────────────────────────────────────
const STATE = {
  tab: 'feed',
  articles: [],
  selected: null,
  fetchStatus: 'idle', // idle | fetching | done | error
  fetchLog: [],
  filter: 'All',
  lastFetch: null,
};

// ── Sources ───────────────────────────────────────────────────
const PRIMARY_SOURCES = [
  { name: 'PortSwigger Research', url: 'https://portswigger.net/research/rss', tier: 1 },
  { name: 'OWASP', url: 'https://owasp.org/feed.xml', tier: 1 },
  { name: 'Google Project Zero', url: 'https://googleprojectzero.blogspot.com/feeds/posts/default', tier: 1 },
  { name: 'Dark Reading', url: 'https://www.darkreading.com/rss.xml', tier: 1 },
  { name: 'CSO Online', url: 'https://www.csoonline.com/feed/', tier: 1 },
];

// ── Topic clusters ────────────────────────────────────────────
const CLUSTERS = [
  'New Vulnerabilities', 'Exploit Chains', 'Software Supply Chain',
  'Malicious Packages', 'AI Application Security', 'Secure SDLC',
  'Developer Risk', 'Cloud-Native AppSec', 'API Security',
  'Governance & CISO', 'Regulatory', 'Threat Intelligence',
];

// ── Scoring weights ───────────────────────────────────────────
function scoreArticle(article) {
  const text = (article.title + ' ' + article.summary).toLowerCase();
  let novelty = 60, relevance = 60, execRelevance = 50, techDepth = 50,
      businessConsequence = 50, discussionPotential = 55, defensibility = 60;

  // Novelty signals
  const noveltyWords = ['new', 'zero-day', 'critical', 'first', 'novel', 'emerging', 'discovered', 'uncovered', 'bypass', 'exploit'];
  noveltyWords.forEach(w => { if (text.includes(w)) novelty = Math.min(100, novelty + 8); });

  // Relevance to AppSec
  const appSecWords = ['vulnerability', 'cve', 'appsec', 'application security', 'injection', 'xss', 'supply chain', 'dependency', 'api', 'authentication', 'authorization', 'sast', 'dast', 'devsecops', 'owasp', 'secure coding', 'patch', 'exploit', 'rce', 'sql', 'ssrf'];
  appSecWords.forEach(w => { if (text.includes(w)) relevance = Math.min(100, relevance + 5); });

  // Executive relevance
  const execWords = ['ciso', 'breach', 'risk', 'governance', 'compliance', 'regulation', 'board', 'cost', 'million', 'enterprise', 'critical infrastructure', 'ransomware'];
  execWords.forEach(w => { if (text.includes(w)) execRelevance = Math.min(100, execRelevance + 8); });

  // Technical depth
  const techWords = ['cve-', 'poc', 'proof of concept', 'payload', 'memory', 'buffer', 'heap', 'kernel', 'protocol', 'parser', 'deserializ', 'race condition', 'privilege escalation'];
  techWords.forEach(w => { if (text.includes(w)) techDepth = Math.min(100, techDepth + 10); });

  // Business consequence
  const bizWords = ['impact', 'affected', 'exposed', 'compromised', 'data loss', 'shutdown', 'attack', 'targeted', 'customers', 'systems'];
  bizWords.forEach(w => { if (text.includes(w)) businessConsequence = Math.min(100, businessConsequence + 7); });

  // Discussion potential
  const debateWords = ['debate', 'controversial', 'question', 'challenge', 'argue', 'disagree', 'versus', 'why', 'should', 'must', 'failure'];
  debateWords.forEach(w => { if (text.includes(w)) discussionPotential = Math.min(100, discussionPotential + 8); });

  // Penalise vendor marketing
  const marketingWords = ['solution', 'platform', 'leading', 'revolutionary', 'best-in-class', 'announces', 'launches', 'partnership', 'award'];
  marketingWords.forEach(w => { if (text.includes(w)) { novelty -= 10; defensibility -= 10; } });

  // Cluster detection
  let cluster = 'Threat Intelligence';
  if (text.includes('supply chain') || text.includes('dependency') || text.includes('package')) cluster = 'Software Supply Chain';
  else if (text.includes('ai') || text.includes('llm') || text.includes('machine learning')) cluster = 'AI Application Security';
  else if (text.includes('api')) cluster = 'API Security';
  else if (text.includes('cve') || text.includes('zero-day') || text.includes('vulnerability')) cluster = 'New Vulnerabilities';
  else if (text.includes('exploit') || text.includes('chain') || text.includes('rce')) cluster = 'Exploit Chains';
  else if (text.includes('ciso') || text.includes('governance') || text.includes('board')) cluster = 'Governance & CISO';
  else if (text.includes('regulation') || text.includes('compliance') || text.includes('gdpr') || text.includes('nist')) cluster = 'Regulatory';
  else if (text.includes('sdlc') || text.includes('devsecops') || text.includes('secure coding')) cluster = 'Secure SDLC';
  else if (text.includes('cloud') || text.includes('kubernetes') || text.includes('container')) cluster = 'Cloud-Native AppSec';
  else if (text.includes('developer') || text.includes('develo')) cluster = 'Developer Risk';

  const total = Math.round((novelty + relevance + execRelevance + techDepth + businessConsequence + discussionPotential + defensibility) / 7);

  return {
    novelty: Math.max(0, Math.round(novelty)),
    relevance: Math.max(0, Math.round(relevance)),
    execRelevance: Math.max(0, Math.round(execRelevance)),
    techDepth: Math.max(0, Math.round(techDepth)),
    businessConsequence: Math.max(0, Math.round(businessConsequence)),
    discussionPotential: Math.max(0, Math.round(discussionPotential)),
    defensibility: Math.max(0, Math.round(defensibility)),
    total: Math.max(0, Math.min(100, total)),
    cluster,
  };
}

// ── RSS fetch ─────────────────────────────────────────────────
function fetchViaJsonp(feedUrl) {
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, 9000);
    function cleanup() { clearTimeout(timer); delete window[cb]; if (script.parentNode) script.remove(); }
    window[cb] = data => { cleanup(); resolve(data); };
    script.src = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feedUrl)}&count=8&callback=${cb}`;
    script.onerror = () => { cleanup(); reject(new Error('script error')); };
    document.head.appendChild(script);
  });
}

async function fetchSource(src) {
  try {
    const data = await fetchViaJsonp(src.url);
    if (data.status === 'ok' && data.items && data.items.length) {
      return data.items.slice(0, 6).map(i => ({
        id: btoa((i.link || i.title || '').slice(0, 40)).slice(0, 12),
        title: (i.title || '').trim(),
        link: i.link || i.url || '',
        summary: (i.description || i.content || '').replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim().slice(0, 400),
        date: i.pubDate || i.published || '',
        source: src.name,
        tier: src.tier,
      })).filter(i => i.title && i.link);
    }
  } catch (e) {}

  // Fallback: allorigins
  try {
    const r = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(src.url)}`, { signal: AbortSignal.timeout(8000) });
    const d = await r.json();
    const xml = d.contents || '';
    const matches = xml.match(/<item>([\s\S]*?)<\/item>/g) || xml.match(/<entry>([\s\S]*?)<\/entry>/g) || [];
    if (matches.length) {
      return matches.slice(0, 6).map(raw => {
        const get = tag => {
          const m = raw.match(new RegExp('<' + tag + '[^>]*><!\\[CDATA\\[([\\s\\S]*?)\\]\\]><\\/' + tag + '>|<' + tag + '[^>]*>([\\s\\S]*?)<\\/' + tag + '>'));
          return m ? (m[1] || m[2] || '').replace(/<[^>]*>/g, '').trim() : '';
        };
        const link = get('link') || get('guid') || raw.match(/<link[^>]*href="([^"]+)"/)?.[1] || '';
        return { id: btoa(link.slice(0, 40)).slice(0, 12), title: get('title'), link, summary: get('description') || get('summary') || '', date: get('pubDate') || get('updated') || '', source: src.name, tier: src.tier };
      }).filter(i => i.title && i.link);
    }
  } catch (e) {}

  return [];
}

// ── Mock fallback articles ────────────────────────────────────
const MOCK_ARTICLES = [
  { id: 'mock1', title: 'Critical OAuth 2.0 Implementation Flaws Found in Major Platforms', link: '#', summary: 'Researchers have identified systemic OAuth 2.0 implementation weaknesses across multiple major platforms, enabling account takeover via token leakage in redirect flows. The flaws affect millions of users and stem from insufficient validation of redirect URIs in authorization code flows.', date: new Date().toISOString(), source: 'PortSwigger Research', tier: 1 },
  { id: 'mock2', title: 'OWASP Updates Top 10 API Security Risks for 2025', link: '#', summary: 'OWASP has released an updated API Security Top 10, elevating Broken Object-Level Authorization and Unrestricted Resource Consumption as the most critical risks facing enterprises. The update reflects two years of real-world breach data.', date: new Date().toISOString(), source: 'OWASP', tier: 1 },
  { id: 'mock3', title: 'Google Project Zero Discloses Windows Kernel Exploit Chain Used in Targeted Attacks', link: '#', summary: 'A newly disclosed exploit chain targeting Windows kernel components was used in targeted espionage campaigns for at least eight months before detection. The chain combines a heap overflow with a logic flaw in privilege validation.', date: new Date().toISOString(), source: 'Google Project Zero', tier: 1 },
  { id: 'mock4', title: 'Supply Chain Attack Targets Widely Used npm Package with 40M Weekly Downloads', link: '#', summary: 'Attackers compromised the maintainer account of a widely used npm package and injected malicious code that exfiltrates environment variables at install time. The package has over 40 million weekly downloads and is a transitive dependency in thousands of enterprise applications.', date: new Date().toISOString(), source: 'Dark Reading', tier: 1 },
  { id: 'mock5', title: 'CISOs Report AI-Generated Code Creating Unmanageable SAST Alert Volumes', link: '#', summary: 'A new survey of 400 enterprise CISOs reveals that AI-assisted development tools are generating code at a pace that existing SAST tooling cannot keep up with, with alert volumes increasing 340% in eighteen months while security headcount has remained flat.', date: new Date().toISOString(), source: 'CSO Online', tier: 1 },
  { id: 'mock6', title: 'SSRF Vulnerabilities in Cloud-Native Architectures Bypassing IMDSv2 Protections', link: '#', summary: 'Security researchers have demonstrated techniques for bypassing AWS IMDSv2 protections via SSRF in containerised workloads, exploiting quirks in how HTTP clients handle hop-by-hop headers in service mesh configurations.', date: new Date().toISOString(), source: 'PortSwigger Research', tier: 1 },
];

// ── Fetch all ─────────────────────────────────────────────────
async function fetchAll() {
  STATE.fetchStatus = 'fetching';
  STATE.fetchLog = [];
  STATE.articles = [];
  render();

  const results = await Promise.allSettled(PRIMARY_SOURCES.map(src => fetchSource(src)));

  let live = [];
  results.forEach((r, i) => {
    const src = PRIMARY_SOURCES[i];
    if (r.status === 'fulfilled' && r.value.length) {
      live = live.concat(r.value);
      STATE.fetchLog.push({ name: src.name, count: r.value.length, ok: true });
    } else {
      STATE.fetchLog.push({ name: src.name, count: 0, ok: false });
    }
  });

  // Deduplicate by title similarity
  const seen = new Set();
  live = live.filter(a => {
    const key = a.title.toLowerCase().slice(0, 40);
    if (seen.has(key)) return false;
    seen.add(key); return true;
  });

  // Score all
  live = live.map(a => ({ ...a, scores: scoreArticle(a) }));

  // If live fetch mostly failed, use mocks with scoring
  if (live.length < 3) {
    const mocked = MOCK_ARTICLES.map(a => ({ ...a, scores: scoreArticle(a), isMock: true }));
    live = [...live, ...mocked];
    STATE.fetchLog.push({ name: 'Curated fallback', count: mocked.length, ok: true });
  }

  // Sort by total score descending
  live.sort((a, b) => b.scores.total - a.scores.total);

  STATE.articles = live;
  STATE.lastFetch = new Date();
  STATE.fetchStatus = 'done';
  STATE.filter = 'All';
  render();
}

// ── Build ChatGPT prompt ──────────────────────────────────────
function buildPrompt(article) {
  const today = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  const scores = article.scores;
  return `Today: ${today}
Source: ${article.source} | Topic Cluster: ${scores.cluster}
Scores — Novelty: ${scores.novelty}/100 | Relevance: ${scores.relevance}/100 | Exec Relevance: ${scores.execRelevance}/100 | Discussion Potential: ${scores.discussionPotential}/100

ARTICLE SELECTED FOR ANALYSIS:
Title: ${article.title}
URL: ${article.link}
Summary: ${article.summary}

---
You are acting as an editorial strategist and senior AppSec thought leader.
Work through the following 5 steps in sequence. Show all work.

STEP 4 — SYNTHESIZE
Produce a concise briefing covering:
- What happened or what is being claimed
- Why it matters technically to AppSec practitioners
- Why it matters commercially or operationally to CISOs and engineering leaders
- What most people are missing or underestimating
- What a CISO, AppSec head, or engineering leader should actually pay attention to

STEP 5 — OBJECT TO ITSELF
Before writing the final post, attack the draft take. Generate:
- The strongest counterargument a senior practitioner would raise
- What makes the take potentially weak, shallow, biased, or overstated
- What an experienced CISO might push back on
- Whether the take is too obvious, too vendor-adjacent, or too generic
- Whether it is summarizing rather than leading
Then rewrite the analysis to address those objections.

STEP 6 — SIMULATE COMMENT REACTIONS
Simulate 8 realistic audience comments from:
1. Supportive CISO
2. Skeptical AppSec engineer
3. Cynical practitioner who has seen this before
4. Developer team lead
5. Cloud security architect
6. Vendor-fatigued enterprise buyer
7. Technically sharp critic
8. Executive who wants business clarity, not technical detail
Each comment must sound like a real professional. Some must disagree. Some must challenge assumptions. None should be cartoonish.

STEP 7 — IMPROVE AFTER FEEDBACK
Use the simulated reactions to produce a stronger version.
Remove weak phrases. Tighten claims. Sharpen the opening line.
Improve credibility and defensibility.

STEP 8 — PRODUCE FINAL OUTPUT

PUNCHLINE
A single crisp line. Executive-grade. The opening line of the LinkedIn post.

EXECUTIVE SUMMARY
3-5 bullets. What it is and why it matters. No fluff.

IMPROVED FINAL POST
2-3 paragraphs in my voice. No emojis. No exclamation marks. No hashtags unless requested. No filler phrases. Take a clear position. Connect technical detail to business consequence. Sound like a real operator in the field.

ALTERNATE HOOKS
5 alternative opening lines.

POSITIONING ANGLE
Label as one of: contrarian | cautionary | strategic | operational | technical-to-business | CISO dilemma | developer-risk | governance-first

ENGAGEMENT SCORE
Rate 1-100 across: credibility | novelty | clarity | executive relevance | discussion potential | defensibility

SOURCE REFERENCES
List articles used with URLs and one-line relevance notes.

---
VOICE RULES (follow strictly):
- Write like a seasoned security leader, not a journalist, marketer, or AI assistant
- No emojis, no exclamation marks, no hashtags
- No filler: "in today's rapidly evolving landscape", "it's important to note", "game changer", "paradigm shift", "leverage" as a buzzword, "moving forward", "journey"
- Short to medium sentences. Dense with meaning.
- Confident but not arrogant
- 2-3 paragraphs only for the final post
- Take a position. Do not sit on the fence.
- Connect technical detail to business consequence
- Sound like someone who has operated in this space, not someone who read about it`;
}

// ── Share to ChatGPT ──────────────────────────────────────────
async function sendToChatGPT() {
  if (!STATE.selected) return;
  const prompt = buildPrompt(STATE.selected);
  try {
    await navigator.clipboard.writeText(prompt);
  } catch (e) {}
  if (navigator.share) {
    try {
      await navigator.share({ title: 'AppSec Post Prompt', text: prompt });
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;
    }
  }
  // Fallback
  window.open('https://chat.openai.com/', '_blank');
  showToast('Prompt copied to clipboard');
}

// ── Clipboard ─────────────────────────────────────────────────
async function copyPrompt() {
  if (!STATE.selected) return;
  try {
    await navigator.clipboard.writeText(buildPrompt(STATE.selected));
    showToast('Prompt copied to clipboard');
  } catch (e) {
    showToast('Could not copy — try Send to ChatGPT instead');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── Render helpers ────────────────────────────────────────────
function scoreColor(n) {
  if (n >= 75) return '#22c55e';
  if (n >= 55) return '#f59e0b';
  return '#ef4444';
}

function timeAgo(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return '';
  const diff = (Date.now() - d) / 1000;
  if (diff < 3600) return Math.round(diff / 60) + 'm ago';
  if (diff < 86400) return Math.round(diff / 3600) + 'h ago';
  return Math.round(diff / 86400) + 'd ago';
}

function renderScoreBar(label, value) {
  return `<div class="score-row">
    <span class="score-label">${label}</span>
    <div class="score-bar"><div class="score-fill" style="width:${value}%;background:${scoreColor(value)}"></div></div>
    <span class="score-num">${value}</span>
  </div>`;
}

// ── Tab: Feed ─────────────────────────────────────────────────
function renderFeed() {
  const clusters = ['All', ...new Set(STATE.articles.map(a => a.scores?.cluster).filter(Boolean))];
  const filtered = STATE.filter === 'All' ? STATE.articles : STATE.articles.filter(a => a.scores?.cluster === STATE.filter);

  let statusHtml = '';
  if (STATE.fetchStatus === 'idle') {
    statusHtml = `<div class="status-row"><div class="dot dot-amber"></div><span>Not yet fetched. Tap Refresh to load live articles.</span></div>`;
  } else if (STATE.fetchStatus === 'fetching') {
    statusHtml = `<div class="status-row"><div class="dot dot-green dot-pulse"></div><span>Fetching from ${PRIMARY_SOURCES.length} primary sources...</span></div>`;
  } else if (STATE.fetchStatus === 'done') {
    const live = STATE.fetchLog.filter(l => l.ok).length;
    const ts = STATE.lastFetch ? STATE.lastFetch.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
    statusHtml = `<div class="status-row"><div class="dot dot-green"></div><span>${STATE.articles.length} articles scored · ${live}/${PRIMARY_SOURCES.length} sources live · ${ts}</span><button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="fetchAll()">Refresh</button></div>`;
  } else if (STATE.fetchStatus === 'error') {
    statusHtml = `<div class="status-row"><div class="dot dot-red"></div><span>Fetch failed. Showing curated fallback articles.</span><button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="fetchAll()">Retry</button></div>`;
  }

  let filtersHtml = '';
  if (STATE.articles.length > 0) {
    filtersHtml = `<div class="filter-row">${clusters.map(c => `<button class="filter-btn ${STATE.filter === c ? 'active' : ''}" onclick="setFilter('${c}')">${c}</button>`).join('')}</div>`;
  }

  let articlesHtml = '';
  if (STATE.fetchStatus === 'idle') {
    articlesHtml = `<div class="empty"><div class="empty-icon">◎</div><h3>No articles loaded</h3><p>Tap Refresh to fetch the latest AppSec articles from primary sources and score them for thought leadership potential.</p><br><button class="btn btn-primary" onclick="fetchAll()">Fetch Latest Articles</button></div>`;
  } else if (STATE.fetchStatus === 'fetching') {
    articlesHtml = `<div class="empty"><div class="empty-icon">⟳</div><h3>Fetching and scoring...</h3><p>Pulling from PortSwigger, OWASP, Google Project Zero, Dark Reading, CSO Online</p></div>`;
  } else if (filtered.length === 0) {
    articlesHtml = `<div class="empty"><div class="empty-icon">◎</div><h3>No articles in this cluster</h3><p>Try a different filter or refresh.</p></div>`;
  } else {
    articlesHtml = filtered.map((a, idx) => {
      const isSelected = STATE.selected && STATE.selected.id === a.id;
      const isMock = a.isMock;
      return `<div class="card ${isSelected ? 'article-selected' : ''}" onclick="selectArticle('${a.id}')">
        <div class="card-header">
          <div class="card-title">${a.title}</div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0">
            <span style="font-size:20px;font-weight:800;color:${scoreColor(a.scores.total)}">${a.scores.total}</span>
            <span style="font-size:10px;color:var(--muted)">/100</span>
          </div>
        </div>
        <div class="card-meta">
          <span class="tag tag-primary">${a.source}</span>
          <span class="tag tag-cluster">${a.scores.cluster}</span>
          ${isMock ? '<span class="tag" style="background:#2d1a00;color:#fb923c">Curated</span>' : ''}
          ${a.date ? `<span style="font-size:11px;color:var(--muted)">${timeAgo(a.date)}</span>` : ''}
        </div>
        <div class="card-summary">${a.summary ? a.summary.slice(0, 160) + (a.summary.length > 160 ? '...' : '') : ''}</div>
        ${renderScoreBar('Novelty', a.scores.novelty)}
        ${renderScoreBar('Exec Relevance', a.scores.execRelevance)}
        ${renderScoreBar('Discussion', a.scores.discussionPotential)}
        ${isSelected ? `<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);display:flex;gap:8px"><button class="btn btn-green btn-sm" onclick="event.stopPropagation();showTab('workbench')">Open in Workbench →</button><a href="${a.link}" target="_blank" class="btn btn-ghost btn-sm" onclick="event.stopPropagation()">Read Article</a></div>` : ''}
      </div>`;
    }).join('');
  }

  return `${statusHtml}${filtersHtml}${articlesHtml}`;
}

// ── Tab: Workbench ────────────────────────────────────────────
function renderWorkbench() {
  if (!STATE.selected) {
    return `<div class="empty"><div class="empty-icon">◎</div><h3>No article selected</h3><p>Go to the Feed tab, score articles, and tap one to select it. Then return here to generate your post.</p><br><button class="btn btn-primary" onclick="showTab('feed')">Go to Feed</button></div>`;
  }

  const a = STATE.selected;
  const s = a.scores;
  const prompt = buildPrompt(a);

  return `<div class="workbench">
    <h2>${a.title}</h2>
    <div class="subtitle">${a.source} · ${s.cluster} · Overall score: <strong style="color:${scoreColor(s.total)}">${s.total}/100</strong></div>

    <div class="scores-grid">
      ${[['Novelty', s.novelty], ['Relevance', s.relevance], ['Exec Relevance', s.execRelevance], ['Tech Depth', s.techDepth], ['Biz Consequence', s.businessConsequence], ['Discussion', s.discussionPotential]].map(([l, v]) => `
        <div class="score-item">
          <div class="score-item-label">${l}</div>
          <div class="score-item-val" style="color:${scoreColor(v)}">${v}</div>
        </div>`).join('')}
    </div>

    <div style="margin-top:20px">
      <div class="section-label">Summary</div>
      <p style="font-size:13px;color:var(--muted);line-height:1.6">${a.summary || 'No summary available.'}</p>
    </div>

    ${a.link && a.link !== '#' ? `<div style="margin-top:12px"><a href="${a.link}" target="_blank" class="btn btn-ghost btn-sm">Read Original Article ↗</a></div>` : ''}

    <div style="margin-top:20px">
      <div class="section-label">ChatGPT Prompt — Steps 4 through 8</div>
      <p style="font-size:12px;color:var(--muted);margin-bottom:8px">This prompt instructs ChatGPT to synthesize, challenge itself, simulate audience reactions, and produce a final executive-grade LinkedIn post in your voice.</p>
      <div class="prompt-box">${prompt.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>
    </div>

    <div style="margin-top:16px;display:flex;flex-direction:column;gap:10px">
      <button class="btn btn-green btn-full" onclick="sendToChatGPT()" style="font-size:15px;padding:14px">
        Send to ChatGPT via Share Sheet
      </button>
      <button class="btn btn-ghost btn-full" onclick="copyPrompt()">Copy Prompt to Clipboard</button>
    </div>

    <div class="share-steps">
      <p style="font-weight:600;color:var(--text);margin-bottom:10px">How this works on your Samsung</p>
      <div class="share-step"><div class="step-num">1</div><span>Tap Send to ChatGPT. Your Android Share Sheet will appear.</span></div>
      <div class="share-step"><div class="step-num">2</div><span>Select ChatGPT from the list. If it does not appear, open the ChatGPT app once manually first.</span></div>
      <div class="share-step"><div class="step-num">3</div><span>ChatGPT receives the full prompt. Hit Send. It will work through all 5 steps.</span></div>
      <div class="share-step"><div class="step-num">4</div><span>Copy the Final Post section from ChatGPT's response. Paste directly into LinkedIn.</span></div>
      <div class="share-step"><div class="step-num">5</div><span>Use the Image Generation Prompt section in ChatGPT's image tab to create your visual.</span></div>
    </div>

    <div style="margin-top:16px">
      <button class="btn btn-ghost btn-full" onclick="showTab('feed')">← Back to Feed</button>
    </div>
  </div>`;
}

// ── Tab: Sources ──────────────────────────────────────────────
function renderSources() {
  const logMap = {};
  STATE.fetchLog.forEach(l => { logMap[l.name] = l; });

  return `<div class="card" style="margin-bottom:16px">
    <div class="section-label" style="margin-bottom:4px">Primary Sources — v1</div>
    <p style="font-size:13px;color:var(--muted);line-height:1.5">These 5 primary sources are fetched, parsed, scored, and ranked on every refresh. Secondary and tertiary sources will be added in v2.</p>
  </div>
  ${PRIMARY_SOURCES.map(src => {
    const log = logMap[src.name];
    const status = !log ? 'Not yet fetched' : log.ok ? `${log.count} articles loaded` : 'Failed — fallback used';
    const statusColor = !log ? 'var(--muted)' : log.ok ? 'var(--green)' : 'var(--amber)';
    return `<div class="source-row">
      <div class="source-info">
        <h4>${src.name}</h4>
        <p>${src.url}</p>
      </div>
      <span class="source-status" style="color:${statusColor}">${status}</span>
    </div>`;
  }).join('')}
  <div style="margin-top:20px">
    <button class="btn btn-primary btn-full" onclick="fetchAll()">Refresh All Sources</button>
  </div>
  <div class="card" style="margin-top:16px">
    <div class="section-label" style="margin-bottom:8px">Scoring Dimensions</div>
    ${[['Novelty', 'Is this new, surprising, or not yet widely discussed?'],
       ['AppSec Relevance', 'How directly does this relate to application security?'],
       ['Executive Relevance', 'Would a CISO or board care about this?'],
       ['Technical Depth', 'Is there substance beyond the headline?'],
       ['Business Consequence', 'Is there a clear commercial or operational impact?'],
       ['Discussion Potential', 'Will this generate meaningful professional debate?'],
       ['Defensibility', 'Can a strong position be taken without misinformation risk?'],
    ].map(([l, d]) => `<div style="margin-bottom:10px"><div style="font-size:13px;font-weight:600;color:var(--text)">${l}</div><div style="font-size:12px;color:var(--muted)">${d}</div></div>`).join('')}
  </div>`;
}

// ── Router ────────────────────────────────────────────────────
function showTab(tab) {
  STATE.tab = tab;
  document.querySelectorAll('nav button').forEach((b, i) => {
    b.classList.toggle('active', ['feed', 'workbench', 'sources'][i] === tab);
  });
  render();
}

function setFilter(f) {
  STATE.filter = f;
  render();
}

function selectArticle(id) {
  const a = STATE.articles.find(x => x.id === id);
  if (!a) return;
  STATE.selected = STATE.selected && STATE.selected.id === id ? null : a;
  render();
}

function render() {
  const el = document.getElementById('main-content');
  if (STATE.tab === 'feed') el.innerHTML = renderFeed();
  else if (STATE.tab === 'workbench') el.innerHTML = renderWorkbench();
  else if (STATE.tab === 'sources') el.innerHTML = renderSources();
}

// ── Init ──────────────────────────────────────────────────────
render();
</script>
</body>
</html>
