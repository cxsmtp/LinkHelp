<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0f172a"/>
<title>POV Lifecycle Dashboard</title>
<script src="https://alcdn.msauth.net/browser/3.10.0/js/msal-browser.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f172a;--surface:#1e293b;--surface2:#263248;--border:#334155;
  --text:#f1f5f9;--muted:#94a3b8;--accent:#3b82f6;--green:#22c55e;
  --amber:#f59e0b;--red:#ef4444;--purple:#a78bfa;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
input,select,textarea{font-family:inherit;font-size:13px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
#app{display:flex;flex-direction:column;height:100vh;max-width:1100px;margin:0 auto}
header{padding:16px 20px 0;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.brand-icon{width:36px;height:36px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;letter-spacing:-.5px}
.brand-text h1{font-size:15px;font-weight:700;color:var(--text)}
.brand-text p{font-size:12px;color:var(--muted)}
.brand-right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
nav{display:flex;gap:4px}
nav button{flex:1;padding:10px 4px;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.4px;text-transform:uppercase}
nav button.active{color:var(--text);border-bottom-color:var(--accent)}
nav button .count{display:inline-block;background:var(--surface2);color:var(--text);border-radius:10px;font-size:10px;padding:1px 6px;margin-left:4px}
.divider{height:1px;background:var(--border)}
main{flex:1;overflow-y:auto;padding:18px 20px}
.status-row{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:14px;font-size:12px;flex-wrap:wrap}
.status-row .grow{flex:1}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-green{background:var(--green)}
.dot-amber{background:var(--amber)}
.dot-red{background:var(--red)}
.dot-pulse{animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.card-title{font-size:14px;font-weight:600;color:var(--text);line-height:1.4;flex:1}
.card-sub{font-size:12px;color:var(--muted)}
.card-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.3px}
.tag-planned{background:#1a2e1a;color:#4ade80}
.tag-progress{background:#1e3a5f;color:#60a5fa}
.tag-done{background:#2d1f4e;color:#c4b5fd}
.tag-mock{background:#2d1a00;color:#fb923c}
.tag-region{background:var(--surface2);color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:8px;border:none;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.2px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#2563eb}
.btn-primary:disabled{background:var(--border);color:var(--muted);cursor:not-allowed}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--muted)}
.btn-ghost:hover{border-color:var(--accent);color:var(--text)}
.btn-green{background:#166534;color:#86efac}
.btn-green:hover{background:#15803d}
.btn-danger{background:#7f1d1d;color:#fecaca}
.btn-danger:hover{background:#991b1b}
.btn-row{display:flex;gap:6px;flex-wrap:wrap}
.btn-sm{padding:6px 10px;font-size:11px}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty-icon{font-size:36px;margin-bottom:12px;opacity:.4}
.empty h3{font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px}
.empty p{font-size:13px;line-height:1.5;max-width:420px;margin:0 auto}
.origins-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px}
.origin-cell{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px}
.origin-cell .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.origin-cell .val{font-size:18px;font-weight:700}
.score-display{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px}
.score-display .num{font-size:24px;font-weight:800;color:var(--accent);min-width:50px}
.score-display .bar{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.score-display .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:3px;transition:width .4s ease}
.kv{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px dashed var(--border)}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted)}
.kv .v{color:var(--text);font-weight:500}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:998;padding:20px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;max-width:480px;width:100%;max-height:90vh;overflow-y:auto}
.modal h2{font-size:16px;font-weight:700;margin-bottom:4px}
.modal .sub{font-size:13px;color:var(--muted);margin-bottom:16px}
.form-row{margin-bottom:12px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;z-index:999;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#toast.error{background:var(--red)}
.signin-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;text-align:center;padding:40px}
.signin-screen h2{font-size:20px;font-weight:700}
.signin-screen p{color:var(--muted);max-width:400px}
.config-warn{background:#2d1a00;border:1px solid #fb923c;color:#fed7aa;padding:10px 14px;border-radius:8px;font-size:12px;margin-bottom:14px;line-height:1.5}
.config-warn code{background:rgba(0,0,0,.3);padding:1px 5px;border-radius:3px;font-family:'SF Mono',Consolas,monospace;font-size:11px}
@media(max-width:520px){
  main{padding:14px}
  .brand-right{display:none}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="brand-icon">POV</div>
      <div class="brand-text">
        <h1>POV Lifecycle Dashboard</h1>
        <p>Track Checkmarx One POVs from planning to score</p>
      </div>
      <div class="brand-right" id="userInfo"></div>
    </div>
    <nav>
      <button data-tab="main" class="active">Main <span class="count" id="cnt-main">0</span></button>
      <button data-tab="monitoring">Monitoring <span class="count" id="cnt-monitoring">0</span></button>
      <button data-tab="survey">Survey &amp; Scores <span class="count" id="cnt-survey">0</span></button>
    </nav>
  </header>
  <div class="divider"></div>
  <main id="main"></main>
</div>
<div id="modalRoot"></div>
<div id="toast"></div>

<script>
'use strict';

// ── CONFIG ──────────────────────────────────────────────────────
// Edit these values for your environment, then deploy.
const CONFIG = {
  msal: {
    clientId:    '<azure-ad-app-client-id>',          // Azure AD app registration (SPA)
    tenantId:    '<your-aad-tenant-id>',              // Your Entra/AAD tenant ID
    redirectUri: window.location.origin + window.location.pathname,
    scopes:      ['Sites.Read.All', 'User.Read']
  },
  sharepoint: {
    siteHost:   'yourtenant.sharepoint.com',          // e.g. contoso.sharepoint.com
    sitePath:   '/sites/POVTracker',                  // SharePoint site path
    listName:   'POVs',                               // SharePoint list display name or GUID
    fieldMap: {                                       // SharePoint internal column name -> app field
      title:        'Title',
      customer:     'Customer',
      status:       'Status',
      startDate:    'StartDate',
      endDate:      'EndDate',
      cxOneRegion:  'TenantRegion',                   // values: us, eu, eu2, anz, india
      cxOneTenant:  'TenantName',
      ownerEmail:   'OwnerEmail',
      surveyFormUrl:'SurveyLink'                      // optional per-POV override
    },
    statusValues: { planned: 'Planned', inProgress: 'In Progress', completed: 'Completed' }
  },
  cxOne: {
    regions: {
      us:    { iam: 'https://iam.checkmarx.net',       api: 'https://ast.checkmarx.net',    label: 'US' },
      eu:    { iam: 'https://eu.iam.checkmarx.net',    api: 'https://eu.ast.checkmarx.net', label: 'EU' },
      eu2:   { iam: 'https://eu-2.iam.checkmarx.net',  api: 'https://eu-2.ast.checkmarx.net',label: 'EU-2' },
      anz:   { iam: 'https://anz.iam.checkmarx.net',   api: 'https://anz.ast.checkmarx.net',label: 'ANZ' },
      india: { iam: 'https://ind.iam.checkmarx.net',   api: 'https://ind.ast.checkmarx.net',label: 'India' }
    }
  },
  survey: {
    defaultFormUrl: 'https://forms.office.com/r/XXXXXXXX'
  }
};

const LS_KEY = 'povTracker:v1';

// ── STATE ───────────────────────────────────────────────────────
const STATE = {
  msal: null,
  account: null,
  tab: 'main',
  povs: [],                    // normalized SharePoint items
  loading: false,
  loadError: null,
  lastSync: null
};

// ── localStorage POV store ──────────────────────────────────────
function loadStore(){
  try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}'); }
  catch(e){ return {}; }
}
function saveStore(s){ localStorage.setItem(LS_KEY, JSON.stringify(s)); }
function getLocal(povId){ return loadStore()[povId] || {}; }
function setLocal(povId, patch){
  const s = loadStore();
  s[povId] = Object.assign({}, s[povId] || {}, patch);
  saveStore(s);
}
function clearLocal(povId){
  const s = loadStore();
  delete s[povId];
  saveStore(s);
}

// ── MSAL auth ───────────────────────────────────────────────────
function configIsPlaceholder(){
  return CONFIG.msal.clientId.startsWith('<') ||
         CONFIG.msal.tenantId.startsWith('<') ||
         CONFIG.sharepoint.siteHost.startsWith('yourtenant.');
}

async function initMsal(){
  if (!window.msal) throw new Error('MSAL library failed to load');
  STATE.msal = new window.msal.PublicClientApplication({
    auth: {
      clientId:    CONFIG.msal.clientId,
      authority:   `https://login.microsoftonline.com/${CONFIG.msal.tenantId}`,
      redirectUri: CONFIG.msal.redirectUri
    },
    cache: { cacheLocation: 'localStorage', storeAuthStateInCookie: false }
  });
  await STATE.msal.initialize();
  await STATE.msal.handleRedirectPromise();
  const accounts = STATE.msal.getAllAccounts();
  if (accounts.length) STATE.account = accounts[0];
}

async function signIn(){
  try {
    const result = await STATE.msal.loginPopup({ scopes: CONFIG.msal.scopes });
    STATE.account = result.account;
    STATE.msal.setActiveAccount(result.account);
    await loadPovs();
    render();
  } catch (e){
    toast('Sign-in failed: ' + (e.message || e), true);
  }
}

async function signOut(){
  await STATE.msal.logoutPopup({ account: STATE.account });
  STATE.account = null;
  STATE.povs = [];
  render();
}

async function getGraphToken(){
  const req = { scopes: ['https://graph.microsoft.com/.default'], account: STATE.account };
  try {
    const r = await STATE.msal.acquireTokenSilent(req);
    return r.accessToken;
  } catch (e){
    if (e instanceof window.msal.InteractionRequiredAuthError){
      const r = await STATE.msal.acquireTokenPopup(req);
      return r.accessToken;
    }
    throw e;
  }
}

// ── SharePoint loader ───────────────────────────────────────────
async function graphGet(path, token){
  const r = await fetch('https://graph.microsoft.com/v1.0' + path, {
    headers: { Authorization: 'Bearer ' + token, Accept: 'application/json' }
  });
  if (!r.ok) throw new Error(`Graph ${r.status}: ${await r.text()}`);
  return r.json();
}

async function loadPovs(){
  if (!STATE.account) return;
  STATE.loading = true; STATE.loadError = null; render();
  try {
    const token = await getGraphToken();
    const sp = CONFIG.sharepoint;
    const site = await graphGet(`/sites/${sp.siteHost}:${sp.sitePath}`, token);
    const list = await graphGet(
      `/sites/${site.id}/lists/${encodeURIComponent(sp.listName)}/items?expand=fields&$top=200`,
      token
    );
    const fm = sp.fieldMap;
    STATE.povs = (list.value || []).map(item => {
      const f = item.fields || {};
      return {
        id:           String(item.id),
        title:        f[fm.title]        || '(untitled)',
        customer:     f[fm.customer]     || '',
        status:       f[fm.status]       || '',
        startDate:    f[fm.startDate]    || '',
        endDate:      f[fm.endDate]      || '',
        cxOneRegion:  (f[fm.cxOneRegion] || '').toLowerCase(),
        cxOneTenant:  f[fm.cxOneTenant]  || '',
        ownerEmail:   f[fm.ownerEmail]   || '',
        surveyFormUrl:f[fm.surveyFormUrl]|| ''
      };
    });
    STATE.lastSync = new Date();
  } catch (e){
    STATE.loadError = e.message || String(e);
    toast('SharePoint load failed: ' + STATE.loadError, true);
  } finally {
    STATE.loading = false;
    render();
  }
}

// ── Checkmarx One client ────────────────────────────────────────
async function exchangeApiKey(region, tenant, apiKey){
  const r = CONFIG.cxOne.regions[region];
  if (!r) throw new Error('Unknown region: ' + region);
  const body = new URLSearchParams({
    grant_type:    'refresh_token',
    client_id:     'ast-app',
    refresh_token: apiKey
  });
  // Tenant is the Keycloak realm name; ast-cli lowercases it before composing the URL.
  const realm = encodeURIComponent(String(tenant).toLowerCase());
  let res;
  try {
    res = await fetch(`${r.iam}/auth/realms/${realm}/protocol/openid-connect/token`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body
    });
  } catch (e) {
    throw new Error('Network/CORS error reaching Cx One IAM. The browser may be blocked from calling ' + r.iam + ' directly.');
  }
  if (!res.ok) throw new Error(`Token exchange ${res.status}: ${await res.text()}`);
  const data = await res.json();
  return data.access_token;
}

function classifyOrigin(scan){
  // Cx One scan object fields (from ast-cli ScanResponseModel):
  //   sourceOrigin -> CI/CD or IDE name (e.g. "GitHub Action", "Jenkins", "VS Code")
  //   sourceType   -> "git" | "upload"
  //   initiator    -> user/service account that triggered it
  const raw = (scan.sourceOrigin || scan.initiator || scan.sourceType || '').toString().toLowerCase();
  if (raw.includes('github action') || raw.includes('github-action')) return 'GitHub Action';
  if (raw.includes('github'))                                         return 'GitHub';
  if (raw.includes('gitlab'))                                         return 'GitLab';
  if (raw.includes('bitbucket'))                                      return 'Bitbucket';
  if (raw.includes('jenkins'))                                        return 'Jenkins';
  if (raw.includes('azure') || raw.includes('ado') || raw.includes('devops')) return 'Azure DevOps';
  if (raw.includes('bamboo'))                                         return 'Bamboo';
  if (raw.includes('circleci') || raw.includes('circle-ci'))          return 'CircleCI';
  if (raw.includes('teamcity'))                                       return 'TeamCity';
  if (raw.includes('cxflow'))                                         return 'CxFlow';
  if (raw.includes('vscode') || raw.includes('vs code'))              return 'VS Code';
  if (raw.includes('intellij') || raw.includes('jetbrains'))          return 'JetBrains';
  if (raw.includes('eclipse'))                                        return 'Eclipse';
  if (raw.includes('visual studio'))                                  return 'Visual Studio';
  if (raw.includes('ide'))                                            return 'IDE';
  if (raw.includes('cli'))                                            return 'CLI';
  if (raw.includes('maven'))                                          return 'Maven';
  if (raw.includes('gradle'))                                         return 'Gradle';
  if (raw.includes('api'))                                            return 'API';
  if (raw.includes('ui') || raw.includes('web') || raw.includes('manual')) return 'Web UI';
  return raw ? raw : 'Other';
}

async function getScanOrigins(region, jwt){
  const r = CONFIG.cxOne.regions[region];
  let res;
  try {
    res = await fetch(`${r.api}/api/scans?limit=200&offset=0`, {
      headers: { Authorization: 'Bearer ' + jwt, Accept: 'application/json' }
    });
  } catch (e) {
    throw new Error('Network/CORS error reaching Cx One AST. The browser may be blocked from calling ' + r.api + ' directly.');
  }
  if (!res.ok) throw new Error(`Scans ${res.status}: ${await res.text()}`);
  const data = await res.json();
  const scans = data.scans || data.items || [];
  const counts = {};
  let total = 0, latest = null;
  for (const s of scans){
    const k = classifyOrigin(s);
    counts[k] = (counts[k] || 0) + 1;
    total++;
    const t = s.createdAt || s.updatedAt;
    if (t && (!latest || t > latest)) latest = t;
  }
  counts.total = total;
  return { counts, latest };
}

async function refreshPovScans(pov){
  const local = getLocal(pov.id);
  if (!local.apiKey) return;
  const region = local.cxOneRegion || pov.cxOneRegion;
  const tenant = local.cxOneTenant || pov.cxOneTenant;
  if (!region || !tenant){ toast('Missing region or tenant for ' + pov.title, true); return; }
  try {
    const jwt = await exchangeApiKey(region, tenant, local.apiKey);
    const { counts, latest } = await getScanOrigins(region, jwt);
    setLocal(pov.id, { scanOriginsCache: counts, lastScanAt: latest, lastFetched: new Date().toISOString() });
    toast('Refreshed ' + pov.title);
  } catch (e){
    toast('Refresh failed: ' + (e.message || e), true);
  }
  render();
}

// ── Bucketing ───────────────────────────────────────────────────
function povsForTab(tab){
  const sv = CONFIG.sharepoint.statusValues;
  return STATE.povs.filter(p => {
    const local = getLocal(p.id);
    const hasKey = !!local.apiKey;
    if (tab === 'monitoring') return hasKey;
    if (tab === 'survey')     return p.status === sv.completed;
    // main
    return (p.status === sv.planned || p.status === sv.inProgress) && !hasKey;
  });
}

// ── Rendering ───────────────────────────────────────────────────
const $main = document.getElementById('main');
const $userInfo = document.getElementById('userInfo');

function render(){
  // Tab counts
  document.getElementById('cnt-main').textContent       = povsForTab('main').length;
  document.getElementById('cnt-monitoring').textContent = povsForTab('monitoring').length;
  document.getElementById('cnt-survey').textContent     = povsForTab('survey').length;

  // User info
  if (STATE.account){
    $userInfo.innerHTML = `
      <span>Signed in: <strong>${esc(STATE.account.username)}</strong></span>
      <button class="btn btn-ghost btn-sm" onclick="signOut()">Sign out</button>`;
  } else {
    $userInfo.innerHTML = '';
  }

  // Active nav
  document.querySelectorAll('nav button').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === STATE.tab);
  });

  // Body
  if (configIsPlaceholder()){
    $main.innerHTML = `
      <div class="config-warn">
        <strong>Configuration required.</strong> Edit the <code>CONFIG</code> block at the top of <code>index.html</code>:
        set your Azure AD <code>clientId</code> and <code>tenantId</code>, your SharePoint <code>siteHost</code>/<code>sitePath</code>,
        the list name, and the field-name map for your POV columns. Then reload.
      </div>` + signinScreen();
    return;
  }

  if (!STATE.account){ $main.innerHTML = signinScreen(); return; }

  if (STATE.loading){
    $main.innerHTML = `
      <div class="status-row"><span class="dot dot-amber dot-pulse"></span><span>Loading POVs from SharePoint…</span></div>`;
    return;
  }

  let html = statusRow();
  if (STATE.tab === 'main')        html += renderMain();
  else if (STATE.tab === 'monitoring') html += renderMonitoring();
  else                              html += renderSurvey();
  $main.innerHTML = html;
}

function signinScreen(){
  return `
    <div class="signin-screen">
      <div style="font-size:48px">🛡️</div>
      <h2>Sign in to view POVs</h2>
      <p>Authenticate with your work account to read the SharePoint POV list and start tracking.</p>
      <button class="btn btn-primary" onclick="signIn()">Sign in with Microsoft</button>
    </div>`;
}

function statusRow(){
  const sync = STATE.lastSync ? STATE.lastSync.toLocaleString() : 'never';
  return `
    <div class="status-row">
      <span class="dot ${STATE.loadError ? 'dot-red' : 'dot-green'}"></span>
      <span>${STATE.loadError ? 'Error: ' + esc(STATE.loadError) : 'SharePoint synced'}</span>
      <span class="grow"></span>
      <span>Last sync: ${esc(sync)}</span>
      <button class="btn btn-ghost btn-sm" onclick="loadPovs()">Refresh</button>
    </div>`;
}

function renderMain(){
  const povs = povsForTab('main');
  if (!povs.length) return emptyState('No planned or in-progress POVs', 'POVs in your SharePoint list with status Planned or In Progress will appear here.');
  return povs.map(p => mainCard(p)).join('');
}

function renderMonitoring(){
  const povs = povsForTab('monitoring');
  if (!povs.length) return emptyState('No POVs being monitored', 'Add a Checkmarx One API key to a POV from the Main tab to start monitoring scan-origin activity here.');
  return povs.map(p => monitoringCard(p)).join('');
}

function renderSurvey(){
  const povs = povsForTab('survey');
  if (!povs.length) return emptyState('No completed POVs', 'POVs marked Completed in SharePoint will appear here so you can send the survey and capture the final score.');
  return povs.map(p => surveyCard(p)).join('');
}

function emptyState(title, body){
  return `<div class="empty"><div class="empty-icon">○</div><h3>${esc(title)}</h3><p>${esc(body)}</p></div>`;
}

function statusTag(status){
  const sv = CONFIG.sharepoint.statusValues;
  if (status === sv.planned)    return `<span class="tag tag-planned">Planned</span>`;
  if (status === sv.inProgress) return `<span class="tag tag-progress">In Progress</span>`;
  if (status === sv.completed)  return `<span class="tag tag-done">Completed</span>`;
  return `<span class="tag tag-mock">${esc(status || 'Unknown')}</span>`;
}

function dateRange(p){
  if (!p.startDate && !p.endDate) return '';
  const f = d => d ? new Date(d).toLocaleDateString() : '?';
  return `${f(p.startDate)} → ${f(p.endDate)}`;
}

function povDayProgress(p){
  if (!p.startDate || !p.endDate) return null;
  const s = new Date(p.startDate), e = new Date(p.endDate), n = new Date();
  const total = Math.max(1, Math.ceil((e - s) / 86400000));
  const elapsed = Math.max(0, Math.min(total, Math.ceil((n - s) / 86400000)));
  return { elapsed, total };
}

function mainCard(p){
  return `
    <div class="card">
      <div class="card-header">
        <div>
          <div class="card-title">${esc(p.title)}</div>
          <div class="card-sub">${esc(p.customer || '—')}</div>
        </div>
        ${statusTag(p.status)}
      </div>
      <div class="card-meta">
        ${p.startDate || p.endDate ? `<span class="tag tag-region">${esc(dateRange(p))}</span>` : ''}
        ${p.cxOneRegion ? `<span class="tag tag-region">Region: ${esc((CONFIG.cxOne.regions[p.cxOneRegion]||{}).label || p.cxOneRegion)}</span>` : ''}
        ${p.cxOneTenant ? `<span class="tag tag-region">Tenant: ${esc(p.cxOneTenant)}</span>` : ''}
      </div>
      <div class="btn-row">
        <button class="btn btn-primary btn-sm" onclick="openApiKeyModal('${p.id}')">Add API key</button>
        ${p.ownerEmail ? `<a class="btn btn-ghost btn-sm" href="mailto:${esc(p.ownerEmail)}">Contact owner</a>` : ''}
      </div>
    </div>`;
}

function monitoringCard(p){
  const local = getLocal(p.id);
  const counts = local.scanOriginsCache || {};
  const total = counts.total || 0;
  const cells = Object.entries(counts).filter(([k]) => k !== 'total').map(([k,v]) =>
    `<div class="origin-cell"><div class="lbl">${esc(k)}</div><div class="val">${v}</div></div>`
  ).join('') || `<div class="origin-cell" style="grid-column:1/-1"><div class="lbl">No scans yet</div><div class="val" style="font-size:13px;color:var(--muted);font-weight:500">Click Refresh to fetch from Cx One</div></div>`;
  const prog = povDayProgress(p);
  const region = local.cxOneRegion || p.cxOneRegion;
  return `
    <div class="card">
      <div class="card-header">
        <div>
          <div class="card-title">${esc(p.title)}</div>
          <div class="card-sub">${esc(p.customer || '—')}</div>
        </div>
        ${statusTag(p.status)}
      </div>
      <div class="card-meta">
        ${prog ? `<span class="tag tag-region">Day ${prog.elapsed} of ${prog.total}</span>` : ''}
        ${region ? `<span class="tag tag-region">Region: ${esc((CONFIG.cxOne.regions[region]||{}).label || region)}</span>` : ''}
        <span class="tag tag-region">Tenant: ${esc(local.cxOneTenant || p.cxOneTenant || '—')}</span>
        <span class="tag tag-progress">Total scans: ${total}</span>
      </div>
      <div class="origins-grid">${cells}</div>
      <div class="kv" style="margin-top:10px"><span class="k">Last scan</span><span class="v">${esc(local.lastScanAt ? new Date(local.lastScanAt).toLocaleString() : '—')}</span></div>
      <div class="kv"><span class="k">Last fetched</span><span class="v">${esc(local.lastFetched ? new Date(local.lastFetched).toLocaleString() : '—')}</span></div>
      <div class="btn-row" style="margin-top:10px">
        <button class="btn btn-primary btn-sm" onclick="refreshById('${p.id}')">Refresh scans</button>
        <button class="btn btn-ghost btn-sm" onclick="openApiKeyModal('${p.id}')">Update key</button>
        <button class="btn btn-danger btn-sm" onclick="removeKey('${p.id}')">Remove key</button>
      </div>
    </div>`;
}

function surveyCard(p){
  const local = getLocal(p.id);
  const sent = !!local.surveySent;
  const score = typeof local.surveyScore === 'number' ? local.surveyScore : null;
  const formUrl = (p.surveyFormUrl || CONFIG.survey.defaultFormUrl) +
    (CONFIG.survey.defaultFormUrl.includes('?') ? '&' : '?') +
    `povId=${encodeURIComponent(p.id)}&customer=${encodeURIComponent(p.customer || '')}`;
  return `
    <div class="card">
      <div class="card-header">
        <div>
          <div class="card-title">${esc(p.title)}</div>
          <div class="card-sub">${esc(p.customer || '—')}</div>
        </div>
        ${statusTag(p.status)}
      </div>
      <div class="card-meta">
        ${p.startDate || p.endDate ? `<span class="tag tag-region">${esc(dateRange(p))}</span>` : ''}
        <span class="tag ${sent?'tag-progress':'tag-mock'}">Survey ${sent?'sent':'not sent'}</span>
        ${local.surveyDate ? `<span class="tag tag-region">Sent: ${esc(new Date(local.surveyDate).toLocaleDateString())}</span>` : ''}
      </div>
      ${score !== null ? `
        <div class="score-display">
          <div class="num">${score}</div>
          <div class="bar"><div class="fill" style="width:${Math.max(0,Math.min(100,score))}%"></div></div>
        </div>` : ''}
      <div class="btn-row" style="margin-top:10px">
        <a class="btn btn-primary btn-sm" href="${esc(formUrl)}" target="_blank" rel="noopener">Open survey</a>
        <button class="btn ${sent?'btn-ghost':'btn-green'} btn-sm" onclick="markSurvey('${p.id}', ${!sent})">${sent?'Mark unsent':'Mark sent'}</button>
        <button class="btn btn-ghost btn-sm" onclick="openScoreModal('${p.id}')">${score !== null ? 'Update' : 'Enter'} final score</button>
      </div>
    </div>`;
}

// ── Modals ──────────────────────────────────────────────────────
const $modalRoot = document.getElementById('modalRoot');
function closeModal(){ $modalRoot.innerHTML = ''; }

function openApiKeyModal(povId){
  const pov = STATE.povs.find(p => p.id === povId);
  if (!pov) return;
  const local = getLocal(povId);
  const region = local.cxOneRegion || pov.cxOneRegion || 'us';
  const tenant = local.cxOneTenant || pov.cxOneTenant || '';
  const regionOpts = Object.entries(CONFIG.cxOne.regions).map(([k,v]) =>
    `<option value="${k}" ${k===region?'selected':''}>${esc(v.label)} (${esc(k)})</option>`
  ).join('');
  $modalRoot.innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h2>Add Checkmarx One API key</h2>
        <p class="sub">${esc(pov.title)} · ${esc(pov.customer || '—')}</p>
        <div class="form-row">
          <label>Region</label>
          <select id="m_region">${regionOpts}</select>
        </div>
        <div class="form-row">
          <label>Tenant name</label>
          <input id="m_tenant" value="${esc(tenant)}" placeholder="e.g. acme"/>
        </div>
        <div class="form-row">
          <label>API key (refresh token)</label>
          <textarea id="m_key" rows="4" placeholder="Paste the refresh-token API key from the customer's Cx One tenant"></textarea>
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary btn-sm" onclick="saveApiKey('${povId}')">Save &amp; fetch</button>
        </div>
      </div>
    </div>`;
}

async function saveApiKey(povId){
  const region = document.getElementById('m_region').value;
  const tenant = document.getElementById('m_tenant').value.trim();
  const apiKey = document.getElementById('m_key').value.trim();
  if (!tenant || !apiKey){ toast('Tenant and API key are required', true); return; }
  // Validate by exchanging the key
  try {
    const jwt = await exchangeApiKey(region, tenant, apiKey);
    const { counts, latest } = await getScanOrigins(region, jwt);
    setLocal(povId, {
      cxOneRegion: region, cxOneTenant: tenant, apiKey,
      scanOriginsCache: counts, lastScanAt: latest, lastFetched: new Date().toISOString()
    });
    closeModal();
    STATE.tab = 'monitoring';
    toast('Key validated and POV moved to Monitoring');
    render();
  } catch (e){
    toast('Could not validate key: ' + (e.message || e), true);
  }
}

function removeKey(povId){
  if (!confirm('Remove the API key for this POV? Local scan data will also be cleared.')) return;
  clearLocal(povId);
  toast('API key removed');
  render();
}

function refreshById(povId){
  const pov = STATE.povs.find(p => p.id === povId);
  if (pov) refreshPovScans(pov);
}

function openScoreModal(povId){
  const pov = STATE.povs.find(p => p.id === povId);
  if (!pov) return;
  const local = getLocal(povId);
  const cur = typeof local.surveyScore === 'number' ? local.surveyScore : '';
  $modalRoot.innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h2>Final POV score</h2>
        <p class="sub">Read the value off the survey Excel and enter it below.</p>
        <div class="form-row">
          <label>Score (0–100)</label>
          <input id="m_score" type="number" min="0" max="100" step="1" value="${esc(String(cur))}"/>
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary btn-sm" onclick="saveScore('${povId}')">Save</button>
        </div>
      </div>
    </div>`;
}

function saveScore(povId){
  const v = parseFloat(document.getElementById('m_score').value);
  if (isNaN(v) || v < 0 || v > 100){ toast('Enter a number between 0 and 100', true); return; }
  setLocal(povId, { surveyScore: v });
  closeModal();
  toast('Score saved');
  render();
}

function markSurvey(povId, sent){
  setLocal(povId, sent ? { surveySent: true, surveyDate: new Date().toISOString() } : { surveySent: false });
  render();
}

// ── Util ────────────────────────────────────────────────────────
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

let toastTimer;
function toast(msg, isError){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.toggle('error', !!isError);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

// ── Wire up nav + boot ─────────────────────────────────────────
document.querySelectorAll('nav button').forEach(b => {
  b.addEventListener('click', () => { STATE.tab = b.dataset.tab; render(); });
});

window.addEventListener('focus', () => {
  // Light auto-refresh of monitoring data when window regains focus
  if (STATE.tab === 'monitoring' && STATE.account){
    povsForTab('monitoring').forEach(p => {
      const local = getLocal(p.id);
      const stale = !local.lastFetched || (Date.now() - new Date(local.lastFetched).getTime() > 5 * 60 * 1000);
      if (stale) refreshPovScans(p);
    });
  }
});

// Expose handlers for inline onclick
Object.assign(window, {
  signIn, signOut, loadPovs,
  openApiKeyModal, saveApiKey, removeKey, refreshById,
  openScoreModal, saveScore, markSurvey, closeModal
});

(async function boot(){
  render();                                    // shows config warning or sign-in
  if (configIsPlaceholder()) return;
  try {
    await initMsal();
    if (STATE.account) await loadPovs();
  } catch (e){
    toast('Init error: ' + (e.message || e), true);
  }
  render();
})();
</script>
</body>
</html>
